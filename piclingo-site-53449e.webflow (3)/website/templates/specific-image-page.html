      <title>Hoverable Button</title>
      <!-- Add Bootstrap CSS -->
      <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
      <!-- Add Bootstrap Icons CSS -->

      <style>
        .hint-button {
          background-color: #fff;
          border-color: #fff;
          color: #FF69B4;
          position: relative;
        }
      
        .hint-content {
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          background-color: rgba(255, 255, 255, 0.9);
          padding: 20px;
          border-radius: 10px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
          display: none;
        }
      
        .hint-button:hover + .hint-content {
          display: block;
        }
      
        .hint-close {
          position: absolute;
          top: 5px;
          right: 5px;
          cursor: pointer;
        }
      </style>
      </head>
      <body>
      
      <button id="hintButton" type="button" class="btn btn-primary btn-lg hint-button">
        <i class="bi bi-lightbulb"></i> Hint
      </button>
      
      <div class="hint-content">
        <span class="hint-close">&times;</span>
        What are the main characters?<br>
        What colors are there?<br>
        Describe the place?<br>
        Can you guess the weather?
      </div>
      
      <script>
        const hintButton = document.getElementById('hintButton');
        const hintContent = document.querySelector('.hint-content');
        const hintClose = document.querySelector('.hint-close');
      
        hintButton.addEventListener('click', function() {
          hintContent.style.display = 'block';
        });
      
        hintClose.addEventListener('click', function() {
          hintContent.style.display = 'none';
        });
      </script>
      
      </body>
      </html>
